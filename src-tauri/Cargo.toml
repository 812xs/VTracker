[package]
name = "valorant-overlay"
version = "0.1.0"
description = "VTracker masaüstü"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
riot-core = { path = "../riot-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
